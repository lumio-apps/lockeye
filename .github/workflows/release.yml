name: Release

# Runs when you push a tag like v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # Recreate the Lockeye release key from repository secrets.
      # Required secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      # GitHub APK: includes the in-app "Check for updates".
      - name: Build GitHub APK
        run: flutter build apk --release

      - name: Sign GitHub APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "Lockeye-${{ github.ref_name }}.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "Lockeye-${{ github.ref_name }}.apk"

      # Print the permissions and target SDK of the built APK.
      - name: Check permissions and target SDK
        run: |
          echo "== GitHub APK =="
          "$BUILD_TOOLS/aapt" dump badging "Lockeye-${{ github.ref_name }}.apk" | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Lockeye-${{ github.ref_name }}.apk
          generate_release_notes: true
